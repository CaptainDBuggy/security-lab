services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - bazaar_db:/data/db
    # no ports exposed to host — Mongo is internal only

  app:
    build: .
    restart: unless-stopped
    depends_on:
      - mongo
    environment:
      - MONGO_URL=mongodb://mongo:27017
      - DB_NAME=blackwall
      - PORT=3000
    ports:
      - "1337:3000"

volumes:
  bazaar_db:
