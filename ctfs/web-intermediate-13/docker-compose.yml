# Project appears in Docker Desktop as "sesame-ctf"
name: sesame-ctf

services:
  sesame:
    build: .
    image: ctf-web-13
    container_name: sesame-ctf
    ports:
      - "8090:5000"       # host 8090 (Burp keeps its default 8080; 8081-8089 taken)
    restart: "no"          # manual control — start/stop from Docker Desktop
    labels:
      com.ctf.name: "Sesame Intermediate Web CTF"
      com.ctf.difficulty: "intermediate"
      com.ctf.url: "http://localhost:8090"
