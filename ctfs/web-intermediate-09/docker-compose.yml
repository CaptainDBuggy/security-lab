# Project appears in Docker Desktop as "bookworm-ctf"
name: bookworm-ctf

services:
  bookworm:
    build: .
    image: ctf-web-09
    container_name: bookworm-ctf
    ports:
      - "8086:5000"       # host 8086 (Burp keeps its default 8080; 8081-8085 taken)
    restart: "no"          # manual control — start/stop from Docker Desktop
    labels:
      com.ctf.name: "Bookworm Intermediate Web CTF"
      com.ctf.difficulty: "intermediate"
      com.ctf.url: "http://localhost:8086"
